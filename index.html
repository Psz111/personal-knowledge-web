<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://api.deepseek.com https://dashscope.aliyuncs.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>个人信息助手</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="workbench">
    <aside class="sidebar" aria-label="工作区导航">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i></span><span>个人信息助手</span></div>
      <nav class="navigation" aria-label="主要功能">
        <button id="new-chat" class="nav-button" type="button"><i class="icon icon-new" aria-hidden="true"></i><span>新对话</span></button>
        <button id="open-records" class="nav-button" type="button"><i class="icon icon-records" aria-hidden="true"></i><span>我的记录</span></button>
      </nav>
      <div class="side-footer">
        <button id="open-settings" class="nav-button" type="button" aria-haspopup="dialog"><i class="icon icon-sliders" aria-hidden="true"></i><span>模型设置</span></button>
      </div>
    </aside>
    <main class="workspace">
      <header class="topbar"><span class="context-mark" aria-hidden="true"></span><h1 id="page-title">当前对话</h1></header>
      <p id="status" class="status" role="status"></p>
      <noscript><p class="no-script">请启用浏览器的 JavaScript，以使用对话和本地记录。</p></noscript>
      <section id="chat-view" class="chat-view" aria-label="对话">
        <div class="thread">
          <div id="empty-state" class="welcome">
            <div class="welcome-glyph" aria-hidden="true"><span class="mark"><i></i><i></i></span></div>
            <h2>想一起读点什么？</h2>
            <p>放入一段材料，或直接聊聊你关心的问题。</p>
          </div>
          <div id="messages" class="messages" role="log" aria-label="对话消息" aria-live="off"></div>
        </div>
        <div class="compose-area">
          <div class="compose-actions"><button id="save-discussion" class="quiet" type="button" disabled><i class="icon icon-bookmark" aria-hidden="true"></i>整理为记录</button></div>
          <form id="composer" class="composer" autocomplete="off">
            <p id="material-summary" class="material-summary" hidden></p>
            <label class="sr-only" for="question">输入问题或文字材料</label>
            <textarea id="question" rows="2" placeholder="发消息，或粘贴想讨论的文字…" spellcheck="true"></textarea>
            <div class="compose-tools">
              <button id="open-material" class="tool" type="button" aria-haspopup="dialog"><i class="icon icon-plus" aria-hidden="true"></i>放入材料</button>
              <button id="model-button" class="tool model-button" type="button" aria-haspopup="dialog"><i class="icon icon-model" aria-hidden="true"></i><span id="model-label">选择模型</span><i class="chevron" aria-hidden="true"></i></button>
              <button id="send" class="send-button" type="submit" title="发送" aria-label="发送"><i class="icon icon-send" aria-hidden="true"></i></button>
              <button id="stop" class="send-button" type="button" title="停止生成" aria-label="停止生成" hidden><i class="stop-mark" aria-hidden="true"></i></button>
            </div>
          </form>
          <p class="composer-note">对话暂存在此页，需要回看时可保存为记录。</p>
        </div>
      </section>
      <section id="records-view" class="records-view" aria-labelledby="records-title" hidden>
        <div class="records-inner">
          <button id="back-to-chat" class="quiet back-button" type="button"><span aria-hidden="true">←</span> 返回对话</button>
          <h2 id="records-title">我的记录</h2>
          <p class="description">这里显示你保存在当前浏览器的理解记录。</p>
          <label class="search-box" for="search"><i class="icon icon-search" aria-hidden="true"></i><span class="sr-only">搜索记录</span><input type="search" id="search" placeholder="按关键词查找记录" autocomplete="off"></label>
          <div id="records-list" class="records-list" aria-label="记录列表"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-content">
      <header class="dialog-head"><h2 id="settings-title">模型设置</h2><button id="close-settings" class="close-button" type="button" data-close aria-label="关闭模型设置">×</button></header>
      <p class="description">使用自己的 API Key。费用由所选模型服务商向你的账号计量。</p>
      <div class="field"><label for="provider">服务商</label><select id="provider"><option value="deepseek">DeepSeek</option><option value="qwen">通义千问（阿里云百炼）</option></select></div>
      <div class="field"><label for="model">模型 ID</label><input id="model" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入自己的 API Key" aria-describedby="key-help"><small id="key-help">浏览器将密钥直接发给你选择的模型服务商，本站不经手。密钥仅留在当前页面，刷新或关闭后需要重新填写。</small></div>
      <div class="receiver"><span>请求地址</span><code id="endpoint"></code></div>
      <label class="consent" for="consent"><input id="consent" type="checkbox"><span>我同意发送时由浏览器将所附正文、本次问题和当前对话发给上面的模型服务商。</span></label>
      <p id="settings-status" class="dialog-status" role="status"></p>
      <footer class="dialog-actions"><button id="disconnect" class="quiet disconnect" type="button">清除当前密钥</button><button id="apply-settings" class="primary" type="button">使用此连接</button></footer>
    </div>
  </dialog>
  <dialog id="material-dialog" aria-labelledby="material-title">
    <div class="dialog-content">
      <header class="dialog-head"><h2 id="material-title">放入材料</h2><button id="close-material" class="close-button" type="button" data-close aria-label="关闭材料">×</button></header>
      <p class="description">放入后可继续编辑。发送消息时，正文会随问题一起交给你选的模型。</p>
      <div class="field"><label for="material">材料正文</label><textarea id="material" rows="8" placeholder="粘贴文章摘录、音轨转写或其他文字…"></textarea></div>
      <div class="field"><label for="source">来源与阅读范围 <span>选填</span></label><input id="source" type="text" placeholder="例如文章名、原链接，或转写的时间段" autocomplete="off"><small>来源留在当前浏览器，未知时可以留空。</small></div>
      <p id="material-status" class="dialog-status" role="status"></p>
      <footer class="dialog-actions"><button id="apply-material" class="primary" type="button">放入当前对话</button></footer>
    </div>
  </dialog>
  <dialog id="record-dialog" aria-labelledby="record-heading">
    <div class="dialog-content">
      <header class="dialog-head"><h2 id="record-heading">保存理解记录</h2><button id="close-record" class="close-button" type="button" data-close aria-label="关闭记录">×</button></header>
      <p class="description">保存前可编辑。记录仅保存在当前设备的这个浏览器。</p>
      <div class="field"><label for="record-title">标题</label><input id="record-title" type="text" autocomplete="off" placeholder="起一个以后找得到的名字"></div>
      <div class="field"><label for="record-material">原始材料</label><textarea id="record-material" rows="3"></textarea></div>
      <div class="field"><label for="record-source">来源与阅读范围</label><input id="record-source" type="text" autocomplete="off" placeholder="来源未知时可留空"></div>
      <div class="field"><label for="record-analysis">AI 的解读 <span>未做外部核查</span></label><textarea id="record-analysis" rows="4"></textarea></div>
      <div class="field"><label for="record-notes">我的备注</label><textarea id="record-notes" rows="3" placeholder="写下你的理解、疑问或保存原因…"></textarea></div>
      <p id="record-status" class="dialog-status" role="status"></p>
      <footer class="dialog-actions"><button id="delete-record" class="quiet danger" type="button" hidden>删除记录</button><button id="save-record" class="primary" type="button">保存到此浏览器</button></footer>
    </div>
  </dialog>
</body>
</html>
